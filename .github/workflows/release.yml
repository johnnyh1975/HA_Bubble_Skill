name: release

# Produces the downloadable, verified bundle for a version. Two ways in:
#
#   - push a tag `vX.Y`      — the version comes from the tag, and must match
#                              SKILL.md or the run fails
#   - run it from the UI     — the version comes from SKILL.md, and the tag is
#     (workflow_dispatch)      created at the commit being released
#
# The second exists because pushing a tag is not always available to whoever
# is doing the release. It used to be a trap: every step read the version from
# GITHUB_REF_NAME, which on a dispatch is the *branch* name, so the run died
# with "Tag vmain does not match SKILL.md version 1.8" and the publish step
# had no tag to publish to anyway. The version is now resolved once, below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race; a cancelled half-published release is worse
# than a queued one. Keyed on the workflow, not on the ref: a dispatch from a
# branch and a tag push for the same version are different refs and would
# otherwise not see each other.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the skill bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-tags so the dispatch path can tell whether the tag it is about
      # to create already exists; the default shallow checkout fetches none.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install "pyyaml==6.0.2"

      # A release must never ship a library that fails its own checks.
      - name: Verify before packaging
        run: python3 scripts/verify.py

      # The one place the version is decided. Every later step reads $VERSION
      # from the environment rather than re-deriving it from the ref, which is
      # what made a dispatch impossible.
      #
      # On a tag push the tag is authoritative and must agree with SKILL.md,
      # or the bundle claims to be something it is not. On a dispatch there is
      # no tag yet, so SKILL.md is authoritative and the publish step creates
      # the tag.
      - name: Resolve the version
        run: |
          SKILL_VERSION=$(python3 - <<'PY'
          import re
          text = open('SKILL.md', encoding='utf-8').read()
          block = re.search(r'(?ms)^metadata:\n(.*?)^---', text).group(1)
          print(re.search(r'^\s*version:\s*([\d.]+)', block, re.M).group(1))
          PY
          )

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "triggered by tag $GITHUB_REF_NAME — tag=$TAG_VERSION  SKILL.md=$SKILL_VERSION"
            if [ "$TAG_VERSION" != "$SKILL_VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION does not match SKILL.md version $SKILL_VERSION"
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            VERSION="$SKILL_VERSION"
            echo "triggered manually from $GITHUB_REF_NAME — releasing v$VERSION from SKILL.md"
            # Refuse to move a tag that already exists somewhere else: that
            # would silently re-point a published release at a different tree.
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              EXISTING=$(git rev-parse "refs/tags/v$VERSION^{commit}")
              if [ "$EXISTING" != "$GITHUB_SHA" ]; then
                echo "::error::Tag v$VERSION already exists at $EXISTING, not at $GITHUB_SHA. Bump the version in SKILL.md, or delete the tag deliberately."
                exit 1
              fi
            fi
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build bundle
        run: |
          mkdir -p dist/HA_Bubble_Skill
          # The bundle is what users install as a skill. Repository tooling
          # and development history are not part of it.
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' \
                   --exclude '__pycache__' --exclude '.DS_Store' \
                   --exclude 'scripts' \
                   --exclude 'CHANGELOG-v*-detail.md' \
                   --exclude 'CODE-REVIEW-LOG.md' \
                   --exclude 'EVAL-SCORESHEET.md' \
                   --exclude 'RELEASE_NOTES_v*.md' \
                   ./ dist/HA_Bubble_Skill/
          cd dist
          zip -rq "HA_Bubble_Skill_v${VERSION}.zip" HA_Bubble_Skill
          # Same tree as a .skill bundle, for direct install.
          cp "HA_Bubble_Skill_v${VERSION}.zip" "ha-bubble-dashboard-v${VERSION}.skill"
          ls -la

      # The bundle ships without scripts/, so run the checker from the repo
      # against the packaged tree rather than from inside it.
      - name: Verify the packaged copy
        run: |
          cp -r scripts dist/HA_Bubble_Skill/scripts
          (cd dist/HA_Bubble_Skill && python3 scripts/verify.py)
          rm -rf dist/HA_Bubble_Skill/scripts
          # Re-zip without the temporary scripts copy
          rm -f "dist/HA_Bubble_Skill_v${VERSION}.zip" \
                "dist/ha-bubble-dashboard-v${VERSION}.skill"
          (cd dist && zip -rq "HA_Bubble_Skill_v${VERSION}.zip" HA_Bubble_Skill \
             && cp "HA_Bubble_Skill_v${VERSION}.zip" \
                   "ha-bubble-dashboard-v${VERSION}.skill")

      # body_path: CHANGELOG.md would paste all 480+ lines of history into
      # every release. Extract just this version's section.
      - name: Extract this version's changelog section
        run: |
          python3 - "$VERSION" <<'PY' > release-body.md
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # (?![\d.]) and not \b: the boundary between "8" and "." IS a word
          # boundary, so `v1.8\b` matched a `## v1.8.1` heading — and matched it
          # first, being higher in the file. The first patch release would have
          # shipped the previous version's notes.
          m = re.search(rf'(?ms)^## v{re.escape(version)}(?![\d.]).*?(?=^## v\d)', text)
          if not m:
              sys.exit(f'No changelog section found for v{version}')
          print(m.group(0).rstrip())
          PY
          head -5 release-body.md

      # tag_name is explicit so a dispatch works: on that path no tag exists
      # yet, and the action creates it at the commit being released. On a tag
      # push it resolves to the same tag that triggered the run.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/HA_Bubble_Skill_v*.zip
            dist/ha-bubble-dashboard-v*.skill
          body_path: release-body.md
          generate_release_notes: false
